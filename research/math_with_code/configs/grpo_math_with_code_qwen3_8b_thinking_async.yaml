# Async GRPO on Harbor math-code tasks with Qwen3-8B.
# Multi-turn is handled by MathCodeHarborAgent inside an isolated per-trial SIF.
# Async = 1-step off-policy via grpo.async_grpo. Dense 8B on dtensor (FSDP2),
# 3 nodes x 4 GPU: 2 generation (8 vLLM replicas) + 1 training.
grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 16
  max_rollout_turns: 1   # gym manages its own internal tool-call steps; NeMo-RL sees one rollout
  max_num_epochs: 100
  # Async collection re-iterates the dataloader for up to max_num_epochs
  # passes (like sync GRPO), so max_num_steps may exceed one epoch: the non8
  # train set has 6389 prompts = 199 full 32-prompt batches per epoch.
  max_num_steps: 100000
  normalize_rewards: true
  use_leave_one_out_baseline: false
  val_period: 10
  val_at_start: false
  val_at_end: true
  overlong_filtering: false
  max_val_samples: null
  val_batch_size: null
  seed: 42
  use_dynamic_sampling: false
  batch_multiplier: 1
  reward_shaping:
    enabled: false
  reward_scaling:
    enabled: false
  skip_reference_policy_logprobs_calculation: true
  seq_logprob_error_threshold: null
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    # Sizing rule: inflight * num_generations_per_prompt should stay ~2x the
    # Harbor agent `concurrency` (128). At 32 groups x 16 gens = 512 requests,
    # semaphore queue waits blew past harbor_request_queue_timeout_sec (job
    # 3929304); 16 x 16 = 256 keeps the slots saturated at the proven depth.
    max_inflight_prompt_groups: 16
    # Keep a multi-call Harbor trajectory on one model version for the first
    # correctness run. Re-enable overlap only after the 16x8 soak is clean.
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false

loss_fn:
  reference_policy_kl_penalty: 0
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: 10.0
  use_on_policy_kl_approximation: false
  # Async GRPO requires importance sampling correction enabled
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2.0
  truncated_importance_sampling_ratio_min: null
  truncated_importance_sampling_type: tis
  sequence_level_importance_ratios: false
  token_level_loss: true

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo-math-with-code-qwen3-8b/checkpoints"
  metric_name: "val:accuracy"
  higher_is_better: true
  keep_top_k: 3
  save_period: 5
  checkpoint_must_save_by: "00:03:45:00"
  save_optimizer: true

policy:
  model_name: "Qwen/Qwen3-8B"
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs:
      enable_thinking: true
  hf_config_overrides: {}
  train_global_batch_size: 512
  train_micro_batch_size: 2
  logprob_batch_size: 2
  generation_batch_size: 32  # HF backend only; Harbor concurrency is configured separately
  max_total_sequence_length: 20480
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 2
    context_parallel_size: 2
    custom_parallel_plan: null
    automodel_kwargs: {}
    lora_cfg:
      enabled: false

  megatron_cfg:
    enabled: false

  draft:
    enabled: false

  dynamic_batching:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64
  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1.0e-6
      weight_decay: 0.0
      betas: [0.9, 0.999]
      eps: 1e-8

  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 0.1
        end_factor: 1.0
        total_iters: 10
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: [10]

  generation:
    # Explicit non-overlapping ranges; see ray.sub for the complete layout.
    port_range_low: 11001
    port_range_high: 15000
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.8
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false   # cudagraphs on (faster decode); enforce_eager did not affect the hang
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      kv_cache_dtype: "auto"
      expose_http_server: true
      skip_tokenizer_init: false
      enable_thinking: true
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: hermes
        reasoning_parser: deepseek_r1
        # The model template drops historical assistant reasoning after the next
        # user turn. Keep it so multi-turn tool trajectories remain contiguous.
        chat_template: |
          {%- if tools %}
              {{- '<|im_start|>system\n' }}
              {%- if messages[0].role == 'system' %}
                  {{- messages[0].content + '\n\n' }}
              {%- endif %}
              {{- "# Tools\n\nYou may call one or more functions to assist with the user query.\n\nYou are provided with function signatures within <tools></tools> XML tags:\n<tools>" }}
              {%- for tool in tools %}
                  {{- "\n" }}
                  {{- tool | tojson }}
              {%- endfor %}
              {{- "\n</tools>\n\nFor each function call, return a json object with function name and arguments within <tool_call></tool_call> XML tags:\n<tool_call>\n{\"name\": <function-name>, \"arguments\": <args-json-object>}\n</tool_call><|im_end|>\n" }}
          {%- else %}
              {%- if messages[0].role == 'system' %}
                  {{- '<|im_start|>system\n' + messages[0].content + '<|im_end|>\n' }}
              {%- endif %}
          {%- endif %}
          {%- set ns = namespace(multi_step_tool=true, last_query_index=messages|length - 1) %}
          {%- for message in messages[::-1] %}
              {%- set index = (messages|length - 1) - loop.index0 %}
              {%- if ns.multi_step_tool and message.role == "user" and message.content is string and not(message.content.startswith('<tool_response>') and message.content.endswith('</tool_response>')) %}
                  {%- set ns.multi_step_tool = false %}
                  {%- set ns.last_query_index = index %}
              {%- endif %}
          {%- endfor %}
          {%- for message in messages %}
              {%- if message.content is string %}
                  {%- set content = message.content %}
              {%- else %}
                  {%- set content = '' %}
              {%- endif %}
              {%- if (message.role == "user") or (message.role == "system" and not loop.first) %}
                  {{- '<|im_start|>' + message.role + '\n' + content + '<|im_end|>' + '\n' }}
              {%- elif message.role == "assistant" %}
                  {%- set reasoning_content = '' %}
                  {%- if message.reasoning_content is string %}
                      {%- set reasoning_content = message.reasoning_content %}
                  {%- else %}
                      {%- if '</think>' in content %}
                          {%- set reasoning_content = content.split('</think>')[0].rstrip('\n').split('<think>')[-1].lstrip('\n') %}
                          {%- set content = content.split('</think>')[-1].lstrip('\n') %}
                      {%- endif %}
                  {%- endif %}
                  {%- if reasoning_content %}
                      {{- '<|im_start|>' + message.role + '\n<think>\n' + reasoning_content.strip('\n') + '\n</think>\n\n' + content.lstrip('\n') }}
                  {%- else %}
                      {{- '<|im_start|>' + message.role + '\n' + content }}
                  {%- endif %}
                  {%- if message.tool_calls %}
                      {%- for tool_call in message.tool_calls %}
                          {%- if (loop.first and content) or (not loop.first) %}
                              {{- '\n' }}
                          {%- endif %}
                          {%- if tool_call.function %}
                              {%- set tool_call = tool_call.function %}
                          {%- endif %}
                          {{- '<tool_call>\n{"name": "' }}
                          {{- tool_call.name }}
                          {{- '", "arguments": ' }}
                          {%- if tool_call.arguments is string %}
                              {{- tool_call.arguments }}
                          {%- else %}
                              {{- tool_call.arguments | tojson }}
                          {%- endif %}
                          {{- '}\n</tool_call>' }}
                      {%- endfor %}
                  {%- endif %}
                  {{- '<|im_end|>\n' }}
              {%- elif message.role == "tool" %}
                  {%- if loop.first or (messages[loop.index0 - 1].role != "tool") %}
                      {{- '<|im_start|>user' }}
                  {%- endif %}
                  {{- '\n<tool_response>\n' }}
                  {{- content }}
                  {{- '\n</tool_response>' }}
                  {%- if loop.last or (messages[loop.index0 + 1].role != "tool") %}
                      {{- '<|im_end|>\n' }}
                  {%- endif %}
              {%- endif %}
          {%- endfor %}
          {%- if add_generation_prompt %}
              {{- '<|im_start|>assistant\n<think>\n' }}
          {%- endif %}
        default_chat_template_kwargs:
          enable_thinking: true
          truncate_history_thinking: false
    vllm_kwargs:
      compilation_config:
        backend: eager
    colocated:
      # Async GRPO requires non-colocated inference: dedicate 2 nodes (8 GPUs) to
      # vLLM generation; the remaining node (4 GPUs) runs dtensor training.
      # Sized for B64G16: gen wall was 1186s vs train 722s on 1 gen node, so 2
      # gen nodes rebalance to ~750s per step. 8 single-GPU replicas at Harbor
      # concurrency=128 is 16 seqs/replica — the proven low-latency regime, so
      # the scaled trial timeouts keep extra headroom.
      enabled: false
      resources:
        gpus_per_node: 4   # must equal cluster.gpus_per_node for non-colocated multi-node
        num_nodes: 2       # 2 nodes dedicated to vLLM generation; the third runs training

data:
  max_input_seq_length: null
  shuffle: true
  num_workers: 0
  use_multiple_dataloader: false
  train:
    # Relative to the driver working directory (the repo root).
    # Alias matches harbor_datasets.dapo_math_17k_non8 in math_code_harbor_agent.yaml
    # and the staged path /tmp/nemo_rl_math_code/dapo_math_17k_non8 on every node.
    data_path: research/math_with_code/responses_api_agents/harbor_agent/data/math_code/dapo_math_17k_non8.jsonl
  validation:
    # Relative to the driver working directory (the repo root).
    data_path: research/math_with_code/responses_api_agents/harbor_agent/data/math_code/aime_2024.jsonl
    # NeMo-Gym validation performs one rollout per dataset row. Repeat the
    # 30 AIME tasks in-memory to report mean accuracy over 4 samples/task.
    repeat: 16
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  should_use_nemo_gym: true
  # Harbor already returns trainable token data. Avoid logging the full response
  # payload for every rollout on shared storage/W&B.
  should_log_nemo_gym_responses: false
  nemo_gym:
    # Every Gym server has its own venv. For multi-node Harbor jobs this path
    # should be on storage visible at the same absolute path from every node.
    # Required: this must be the shared Lustre venv root on every Ray node.
    uv_venv_dir: ${oc.env:NEMO_GYM_VENV_DIR}
    skip_venv_if_present: true
    port_range_low: 15001
    port_range_high: 20000
    rollout_max_attempts_to_avoid_lp_nan: 1
    is_trajectory_collection: false
    # nemo-gym resolves these cwd-first, then falls back to the Gym install.
    # The repo-root `responses_api_agents` symlink points at the overlay fork in
    # research/math_with_code/, so the harbor_agent entry loads the fork while
    # vllm_model still comes from the pinned Gym submodule.
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml  # Required! must be *for_training
    - responses_api_agents/harbor_agent/configs/math_code_harbor_agent.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: true
          extra_body:
            chat_template_kwargs:
              enable_thinking: true
              truncate_history_thinking: false
    math_code_harbor_agent:
      responses_api_agents:
        harbor_agent:
          harbor_agent_kwargs:
            # Harbor owns the internal model/tool loop; grpo.max_rollout_turns
            # remains 1 because NeMo-RL sees the full Harbor run as one rollout.
            max_steps: 16

logger:
  log_dir: "results/grpo-math-with-code-qwen3-8b/logs"
  num_val_samples_to_print: 0
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "grpo-math-with-code"
    name: "qwen3-8b-thinking-mathcode-async"
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 4
  num_nodes: 3
  master_port_range_low: 25000
  master_port_range_high: 28000
  segment_size: null
