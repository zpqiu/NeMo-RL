# FP8 end-to-end arm: the final FP8 rollout recipe, with pow2 scales + Megatron
# training in FP8 (linear-layer GEMMs only, blockwise recipe, hybrid format).
# Goal: the full chain — trainer GEMMs, refit weight cast, and rollout
# activation quant — shares one quantization geometry: 128-block, power-of-2
# scales.
#
# Two deliberate deltas vs the FP8 rollout control (NOT a single-variable A/B):
#   1. policy.megatron_cfg.fp8_cfg: trainer linear GEMMs go FP8 blockwise.
#   2. rollout pow2_*_scaling_factors: true — aligns the rollout quant grid
#      with the trainer's (on GB200 the trainer CANNOT do non-pow2: blockwise
#      is MXFP8-emulated per TE PR #2157 and pow2 is mandatory; so alignment
#      must come from the rollout side). Grid alignment is the point of the
#      arm, so both move together.
#
# Training-side quantization surface: TE Linear/GroupedLinear GEMMs only.
# Attention (fp8_dpa off), embeddings, lm_head, and the MoE router
# (moe_router_dtype: fp32 in the base yaml) all stay high precision — the
# rollout recipe likewise excludes the router from vLLM FP8 conversion.
#
# Recipe notes:
# - fp8: "hybrid" (fwd act/weight e4m3, bwd grads e5m2) — the verified-stable
#   training scheme. TE's Float8BlockScaling accepts HYBRID (only pure E5M2
#   is asserted out).
# - Do NOT set NVTE_FP8_BLOCK_SCALING_FP32_SCALES here: Hopper-only relief;
#   on sm100 TE 2.15 hard-errors at the first quantize (the 8B/moonlight
#   exemplars that set it ran on Hopper).
# - fp8_param: false — master weights stay bf16 (known NaN
#   token_mult_prob_error with fp8_param: true, NeMo-RL issue #1164); refit
#   re-quantizes from bf16 exactly as in the rollout control (now onto the pow2 grid).
# - Rollout pow2 mechanics: weights via cast_tensor_to_fp8_blockwise's pow2
#   branch (E8M0-biased exponents, battle-tested on the 8B pow2 runs);
#   activations via forcing use_ue8m0=True in vLLM 0.20's own
#   per_token_group_quant_fp8 (fp8.py patches both the fp8_utils and
#   fused_moe.utils namespaces — the latter holds an import-time binding).
#   Note the engine's INITIAL load still quantizes with vLLM's stock
#   non-pow2 weight cast; the grid becomes fully pow2 after the first refit
#   (val_at_start baseline is unaffected: it measures the pre-training
#   model either way).
# - Sequence-packing pad divisor auto-switches to 128 for blockwise
#   (nemo_rl/models/megatron/data.py); no config change needed.
# - use_precision_aware_optimizer stays true (base yaml), matching the rollout
#   control. Flip to false only if NaNs implicate optimizer-state dtype.
defaults: grpo_math_with_code_qwen3_30ba3b_instruct_async_fp8.yaml

policy:
  megatron_cfg:
    fp8_cfg:
      enabled: true
      fp8: "hybrid"
      fp8_recipe: "blockwise"
      fp8_param: false

  generation:
    vllm_cfg:
      pow2_weight_scaling_factors: true
      pow2_activation_scaling_factors: true

checkpointing:
  # Own tree — see the rollout-control config for why inheriting this is a trap.
  checkpoint_dir: "research/math_with_code/.artifacts/runs/qwen3-30ba3b-fp8-e2e-bw/checkpoints"

logger:
  log_dir: "research/math_with_code/.artifacts/runs/qwen3-30ba3b-fp8-e2e-bw/logs"
  wandb:
    name: "qwen3-30ba3b-instruct-mathcode-async-fp8-e2e-bw-pow2"
