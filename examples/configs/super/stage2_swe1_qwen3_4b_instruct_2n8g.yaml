defaults: ./stage2_swe1.yaml

# Dense Qwen3-4B initial Stage 2.1 config:
# one 8-GPU node for FSDP2 training and one 8-GPU node for non-colocated vLLM generation.

checkpointing:
  checkpoint_dir: "results/qwen3_4b_instruct_stage2_swe1_2n8g"
  save_period: 10

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8

policy:
  model_name: "Qwen/Qwen3-4B-Instruct-2507"
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 64
  generation_batch_size: 8
  # SWE pivot prompts can expand dramatically once tool schemas and chat formatting
  # are included in the actual request sent to vLLM.
  max_total_sequence_length: 49152
  logprob_chunk_size: 512

  dtensor_cfg:
    enabled: false
    activation_checkpointing: true
    tensor_parallel_size: 4
    context_parallel_size: 2

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 0
    activation_checkpointing: true
    converter_type: "Qwen3ForCausalLM"
    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 2
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true
    freeze_moe_router: false
    # Qwen3-4B has no MTP head. Megatron's GPT postprocess currently gates on
    # `mtp_num_layers is not None`, so inherited `0` still enters MTP loss code.
    mtp_loss_scaling_factor: 0.0
    mtp_use_repeated_layer: false
    mtp_num_layers: null
    mtp_detach_heads: false

    optimizer:
      optimizer: "adam"
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: false
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 100000
      lr_warmup_iters: 10
      lr_warmup_init: 3e-7

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: True
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}

  optimizer: null

  scheduler: null

  generation:
    max_new_tokens: 2048
    vllm_cfg:
      tensor_parallel_size: 1
      max_model_len: ${policy.max_total_sequence_length}
      gpu_memory_utilization: 0.65
      enable_thinking: false
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: hermes
        # chat_template_kwargs:
        #   enable_thinking: false
        #   truncate_history_thinking: true
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 1

env:
  should_use_nemo_gym: true
  nemo_gym:
    skip_venv_if_present: true
    port_range_low: 15001
    port_range_high: 20000
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - resources_servers/single_step_tool_use_with_argument_comparison/configs/swe_pivot_single_step_tool_use_with_argument_comparison.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: false
          chat_template_kwargs:
            enable_thinking: false
            truncate_history_thinking: true

logger:
  log_dir: "logs/qwen3_4b_instruct_stage2_swe1_2n8g"
  num_train_samples_to_print: 1
  wandb:
    project: "super-v3-posttraining"
    name: "qwen3-4b-instruct-stage2-swe1-2n8g"

cluster:
  gpus_per_node: 8
  num_nodes: 2
